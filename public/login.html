<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        required
    >

    <button type="submit">
        Se connecter
    </button>

    <p id="message"></p>

</form>
