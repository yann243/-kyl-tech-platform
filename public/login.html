<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYL Tech — Connexion</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<main class="login-container">

    <div class="login-card">

        <h1>🔐 KYL Tech</h1>

        <p>Administration</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Adresse email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</main>

<script src="/js/login.js"></script>

</body>
</html>
